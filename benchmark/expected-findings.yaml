  - id: CMP-SEC-001
    category: security
    severity: critical
    confidence: high
    file: terraform/iam.tf
    resource: aws_iam_role_policy.lambda_admin
    evidence: 'Statement with actions = ["*"] and resources = ["*"].'
    cwe: CWE-250
    why_it_matters: >
      All four Lambda functions share one role with full administrative access. Any
      code-execution flaw in the least important function becomes account compromise.
    recommendation: >
      One role per function, scoped to the specific actions each needs. The process
      function needs only s3:GetObject on input, s3:PutObject on output,
      dynamodb:UpdateItem on the table, and the SQS receive/delete set.
    validation: IAM Access Analyzer; CloudTrail-derived least-privilege policy generation.

  - id: CMP-SEC-007
    category: security
    severity: high
    confidence: high
    files:
      - src/cloud_pipeline/logging_utils.py
      - src/cloud_pipeline/handler.py
      - src/cloud_pipeline/services/ingest_service.py
    symbol: log_payload
    evidence: >
      Entire event and payload objects serialised to logs with no redaction.
      handler.ingest_handler logs the full event including headers (which carry the
      Authorization / x-api-token value); ingest_service.submit logs the body
      containing customer_email and callback_token.
    cwe: CWE-532
    why_it_matters: Credentials and personal data written in plaintext to log groups that never expire.
    recommendation: Allow-list logged fields, redact token-shaped values, hash identifiers.
    validation: Logs Insights query for "token" / "email" patterns in recent events.

  - id: CMP-SEC-010
    category: security
    severity: high
    confidence: high
    files:
      - src/cloud_pipeline/services/ingest_service.py
      - src/cloud_pipeline/workers/queue_worker.py
    symbol: build_job_record
    evidence: >
      object_key taken verbatim from caller input and used directly as an S3 key in
      queue_worker.process_message. validate_submission never inspects it.
    cwe: CWE-22
    why_it_matters: >
      A caller-controlled key lets the submitter steer reads and writes to arbitrary
      objects within the bucket. The role's s3:* permission (CMP-SEC-008) widens this further.
    recommendation: Validate against a strict allow-list pattern and prefix the key server-side.
    validation: Submit the traversal fixture in fixtures/sample_records.json and observe it is accepted.

  - id: CMP-SEC-015
    category: security
    severity: high
    confidence: high
