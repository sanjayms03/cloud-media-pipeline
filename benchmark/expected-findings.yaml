    why_it_matters: >
      A failing dependency pins the function for the full 900s timeout at 4096 MB,
      then the message is redelivered up to 1000 more times. Combined with
      CMP-COST-008 and CMP-COST-021 this is the largest cost-amplification path in
      the repository. time.sleep inside Lambda is billed at full rate.
    impact_band: moderate
    estimation_method: >
