    recommendation: Extract event normalisation, authentication and response building into separate functions.
    validation: "ruff check --select C901 with the ignore removed; radon cc."

  - id: CMP-CODE-026
    category: code_health
    severity: high
    confidence: high
    files:
      - src/cloud_pipeline/services/report_service.py
      - src/cloud_pipeline/services/billing_service.py
    symbols: [summarise, aggregate_for_billing]
    evidence: >
      Two near-identical aggregation implementations that have already drifted:
      report_service counts status "FAILED", billing_service counts "ERROR". Both
      statuses are produced elsewhere in the codebase.
    why_it_matters: >
      The operational report and the invoice disagree about how many jobs failed, and
      neither is correct. This is a correctness bug caused by duplication, not just a
      style issue.
    recommendation: Extract one aggregation function and a single status enum shared by both callers.
    validation: Run both functions over fixtures/sample_records.json and compare failure counts.

  - id: CMP-CODE-037
    category: code_health
    severity: high
    confidence: high
    file: src/cloud_pipeline/repositories/job_repository.py
    symbol: is_duplicate
    evidence: Idempotency check against the module-level PROCESSED_JOBS dict.
    why_it_matters: >
      Lambda runs many concurrent containers, so this catches only duplicates landing
      on the same container. Combined with CMP-COST-008 (visibility timeout shorter
      than the function timeout) duplicate processing is routine, not exceptional.
    recommendation: >
      Conditional write against DynamoDB
      (ConditionExpression="attribute_not_exists(job_id)") or a dedicated idempotency table.
    validation: Replay the same message twice concurrently and observe both are processed.

  - id: CMP-CODE-010
    category: code_health
    severity: high
    confidence: high
    files:
      - src/cloud_pipeline/clients/s3_client.py
      - src/cloud_pipeline/workers/cleanup_worker.py
    symbol: list_objects
    evidence: list_objects_v2 called without handling ContinuationToken.
    why_it_matters: >
      Capped at 1000 keys. Once either bucket exceeds that, cleanup silently operates
      on an arbitrary subset and reports success, so storage grows unbounded while
      monitoring looks healthy.
    recommendation: Use the list_objects_v2 paginator.
    validation: Create 1001 objects under a prefix and count what the function returns.

  - id: CMP-CODE-041
    category: code_health
    severity: critical
    confidence: high
    file: src/cloud_pipeline/workers/queue_worker.py
    symbol: handle_sqs_event
    evidence: 'Exception handler returns {"statusCode": 200, ...} after a batch failure.'
    why_it_matters: >
      Reporting success to Lambda causes SQS to delete the messages, so unprocessed
      work is lost silently. Silent data loss presented as success is the most
      dangerous failure mode in this codebase. CMP-CODE-030 (safe_call) and
      CMP-CODE-044 (run_cleanup) follow the same pattern.
    recommendation: >
      Re-raise, or return batchItemFailures with the failed message IDs and set
      function_response_types = ["ReportBatchItemFailures"] on the event source mapping.
    validation: Force a mid-batch exception and check whether messages reach the DLQ.

  - id: CMP-CODE-043
    category: code_health
    severity: medium
    confidence: high
    file: src/cloud_pipeline/workers/cleanup_worker.py
    symbol: write_cleanup_manifest
    evidence: NamedTemporaryFile(delete=False) never closed and never removed.
    why_it_matters: >
      Lambda /tmp is 512 MB and persists across warm invocations, so the container
      eventually fails every invocation with ENOSPC.
    recommendation: Use a context manager and delete the file, or write the manifest to S3.
    validation: Invoke repeatedly against a warm container and watch /tmp usage.

