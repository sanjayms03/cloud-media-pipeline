      the duplication factor from SQS NumberOfMessagesReceived vs Lambda Invocations.
    recommendation: >
      Replace with retry_with_backoff (already implemented in the same module and
      unused), bound attempts, add jitter, and distinguish retryable from terminal errors.
    tradeoffs: None — the current behaviour has no legitimate use case.
    validation: Lambda Duration p99 and the message-to-invocation ratio.

